apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: transparenta-eu-dev

resources:
- ../../base
- pdb.yaml
- service-account.yaml

labels:
- includeSelectors: true
  includeTemplates: true
  pairs:
    app.kubernetes.io/environment: development
    app.kubernetes.io/name: hack-for-facts-eb-client
    app.kubernetes.io/part-of: transparenta-eu

patches:
- path: configmap-patch.yaml
- path: remove-platform-owned-resources.yaml
- path: workload-patch.yaml

# Chronos image pin is independent of the shared Phoenix base.
images:
- name: harbor.devostack.com/hack-for-facts/hack-for-facts-eb-client
  newName: harbor.devostack.com/hack-for-facts/hack-for-facts-eb-client
  newTag: b468df65e4d19bb9b1ef2255911a62f96e05c6cf

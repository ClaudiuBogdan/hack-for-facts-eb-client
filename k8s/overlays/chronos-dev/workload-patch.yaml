apiVersion: apps/v1
kind: Deployment
metadata:
  name: hack-for-facts-eb-client
  namespace: hack-for-facts
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        image-sha: d96ef0bafd8ec29d3e7554b930186b83c76094e5
    spec:
      serviceAccountName: hack-for-facts-eb-client
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: dedicated
          operator: Equal
          value: compute
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: hack-for-facts-eb-client
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hack-for-facts-eb-client
              topologyKey: kubernetes.io/hostname
      containers:
        - name: hack-for-facts-eb-client
          envFrom:
            - configMapRef:
                name: hack-for-facts-eb-client-config
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi

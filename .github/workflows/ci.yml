name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-http-header-size=64384

jobs:
  typecheck:
    name: Type Check and Lint
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test secret sealing safeguards
        run: yarn secrets:test

      - name: Run TypeScript check
        run: yarn typecheck

      - name: Run Lint
        run: yarn lint

  unit-tests:
    name: Unit Tests (${{ matrix.shard }}/${{ matrix.total_shards }})
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total_shards: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Vitest
        run: yarn test --shard=${{ matrix.shard }}/${{ matrix.total_shards }} --maxWorkers=75%

  # Integration gates dev deployment; keep this sharded to stay under job timeouts.
  integration-tests:
    name: Integration Tests (${{ matrix.shard }}/${{ matrix.total_shards }})
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total_shards: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Integration Tests
        run: npx playwright test --project=integration --reporter=list --max-failures=5 --retries=2 --shard=${{ matrix.shard }}/${{ matrix.total_shards }}
        env:
          CI: true
          E2E_MODE: mock
          # Browser fixtures cannot intercept SSR. Fail SSR reads locally so
          # the normal client fallback receives fixtures, never live dev data.
          VITE_API_URL: http://127.0.0.1:65534
          INTERNAL_API_URL: http://127.0.0.1:65534
          VITE_APP_VERSION: 1.0.0-ci
          VITE_APP_NAME: Transparenta
          VITE_APP_ENVIRONMENT: ci

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: integration-test-results-${{ matrix.shard }}-${{ matrix.total_shards }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Build
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        # This is the only build made from a full checkout, so it is the only one
        # that contains src/development/. The Docker build has already excluded
        # that directory, so validating there alone would never catch a leak.
        run: yarn build && yarn build:validate
        env:
          NODE_OPTIONS: --max-http-header-size=64384 --max-old-space-size=3072
          VITE_API_URL: https://dev-chronos-api.transparenta.eu
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_APP_NAME: Transparenta
          VITE_APP_ENVIRONMENT: ci

  validate-learning-content:
    name: Validate Learning Content
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate Learning Content
        run: yarn learning:validate

      - name: Upload validation results
        uses: actions/upload-artifact@v6
        with:
          name: learning-content-validation-results
          path: |
            learning-content-validation-results/
          retention-days: 7

  validate-challenge-content:
    name: Validate Challenge Content
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate Challenge Content
        run: yarn challenge:validate

  deploy-dev:
    name: Deploy Dev
    runs-on: ubuntu-latest
    environment: development
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [typecheck, unit-tests, integration-tests, build, validate-learning-content, validate-challenge-content]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Secrets from Bitwarden
        uses: bitwarden/sm-action@v1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            9b3cdd24-396a-457e-8d56-b2d600dda041 > DOCKER_REGISTRY_URL
            c9992fd1-98c0-4e2c-a4e5-b2d600dd3367 > DOCKER_USERNAME
            ca2abaf7-e7f5-40d5-a06a-b2d600dd4ba9 > DOCKER_PASSWORD

      - name: Normalize Registry URL
        run: |
          url="${DOCKER_REGISTRY_URL#https://}"
          url="${url#http://}"
          echo "DOCKER_REGISTRY=${url}" >> "$GITHUB_ENV"

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg SENTRY_SOURCEMAPS=true \
            --build-arg VITE_APP_VERSION=${{ github.sha }} \
            -t ${{ env.DOCKER_REGISTRY }}/hack-for-facts-eb-client:${{ github.sha }} \
            .

      - name: Push Docker Image
        run: docker push ${{ env.DOCKER_REGISTRY }}/hack-for-facts-eb-client:${{ github.sha }}

      - name: Setup Kustomize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KUSTOMIZE_VERSION="5.8.1"
          INSTALL_DIR="${RUNNER_TEMP}/bin"
          mkdir -p "${INSTALL_DIR}"
          gh release download "kustomize/v${KUSTOMIZE_VERSION}" \
            --repo kubernetes-sigs/kustomize \
            --pattern "kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            --dir "${INSTALL_DIR}"
          tar -xzf "${INSTALL_DIR}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -C "${INSTALL_DIR}" kustomize
          chmod +x "${INSTALL_DIR}/kustomize"
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"
          "${INSTALL_DIR}/kustomize" version

      - name: Update Image Tag and SHA in Kustomization
        run: |
          cd ./k8s/overlays/chronos-dev
          kustomize edit set image ${{ env.DOCKER_REGISTRY }}/hack-for-facts-eb-client=${{ env.DOCKER_REGISTRY }}/hack-for-facts-eb-client:${{ github.sha }}
          sed -i "s| image-sha: .*| image-sha: ${{ github.sha }}|" workload-patch.yaml

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/overlays/chronos-dev/kustomization.yaml k8s/overlays/chronos-dev/workload-patch.yaml
          git diff --staged --quiet || git commit -m "ci(image): Pin Chronos dev ${GITHUB_SHA:0:12}"
          git push origin dev

  deploy-prod:
    name: Deploy Prod
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve Promoted Dev Image Tag
        id: promoted-image
        run: |
          image_tag="$(awk '/newTag:/{print $2; exit}' k8s/base/kustomization.yaml)"
          if [ -z "${image_tag}" ]; then
            echo "Could not resolve image tag from k8s/base/kustomization.yaml" >&2
            exit 1
          fi
          if [ "${image_tag}" = "latest" ]; then
            echo "Refusing to deploy with mutable image tag 'latest' in production." >&2
            exit 1
          fi
          echo "Using promoted image tag: ${image_tag}"
          echo "tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Get Secrets from Bitwarden
        uses: bitwarden/sm-action@v1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            9b3cdd24-396a-457e-8d56-b2d600dda041 > DOCKER_REGISTRY_URL
            c9992fd1-98c0-4e2c-a4e5-b2d600dd3367 > DOCKER_USERNAME
            ca2abaf7-e7f5-40d5-a06a-b2d600dd4ba9 > DOCKER_PASSWORD

      - name: Normalize Registry URL
        run: |
          url="${DOCKER_REGISTRY_URL#https://}"
          url="${url#http://}"
          echo "DOCKER_REGISTRY=${url}" >> "$GITHUB_ENV"

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Extract Promoted Image Assets
        run: |
          image="${{ env.DOCKER_REGISTRY }}/hack-for-facts-eb-client:${{ steps.promoted-image.outputs.tag }}"
          docker pull "${image}"
          container_id="$(docker create "${image}")"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          rm -rf ./sentry-artifacts
          docker cp "${container_id}:/app/sentry-artifacts" ./sentry-artifacts
          test -d ./sentry-artifacts/assets

      - name: Setup Node.js (Sentry Upload)
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Yarn (Sentry Upload)
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies (Sentry Upload)
        run: yarn install --frozen-lockfile

      - name: Validate Extracted Sentry Assets
        run: |
          node scripts/validate-sentry-debug-ids.mjs ./sentry-artifacts/assets

      - name: Upload Sentry Sourcemaps (Prod)
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.promoted-image.outputs.tag }}
        run: |
          ./node_modules/.bin/sentry-cli sourcemaps upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            --auth-token "$SENTRY_AUTH_TOKEN" \
            --release "$SENTRY_RELEASE" \
            --url-prefix "~/assets" \
            --validate \
            --strict \
            --wait \
            "./sentry-artifacts/assets"

name: Nightly Tests

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-http-header-size=64384

jobs:
  e2e-live:
    name: E2E Tests (Live API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npx playwright test --project=e2e --reporter=list --max-failures=3
        env:
          CI: true
          E2E_MODE: live
          E2E_BASE_URL: https://dev-chronos.transparenta.eu

      - name: Upload E2E test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
